spring:
  application:
    name: acait-backend

  profiles:
    active: elementary
    include: secret # application-secret.yml 파일을 포함해서 로드함

  datasource:
    # MySQL 설정 (Docker)
    url: jdbc:mysql://localhost:3310/acait?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME} # secret 파일에 정의 (기본값: root)
    password: ${DB_PASSWORD} # secret 파일에 정의

  # H2 Console (MySQL 사용 시 비활성화 권장하지만, 로컬 테스트용으로 남겨둘 수도 있음 - 여기선 비활성화)
  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update # 운영 환경에서는 validate 또는 none 권장
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # OAuth2 설정 (값은 application-secret.yml에서 가져옴)
  security:
    oauth2:
      client:
        registration:
          google:
            scope: profile, email
            # client-id, client-secret은 secret 파일에 있음

  # Mail 설정 (값은 application-secret.yml에서 가져옴)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME} # secret 파일에 정의
    password: ${MAIL_PASSWORD} # secret 파일에 정의
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT 설정 (값은 application-secret.yml에서 가져옴)
jwt:
  # secret: ...
  access-token-validity-in-seconds: 3600 # 1시간 (이건 공개되어도 상관없음)

logging:
  level:
    com.academy: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

server:
  port: 8080

# Swagger (SpringDoc OpenAPI) 설정
springdoc:
  api-docs:
    path: /v3/api-docs # 기본값으로 변경 (/api-docs -> /v3/api-docs)
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true # 기본 URL 비활성화 (보안 강화)
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
